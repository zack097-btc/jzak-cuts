# Builds the installable Windows version of JZAK Cuts.
#
# Push a tag like v10.0.0 and this produces a signed-ready .exe installer and a
# .msi, attaches both to a GitHub Release, and leaves them downloadable. Run it
# by hand from the Actions tab any time you just want a fresh build to test.
name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Reuse the last build's compiled crates
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # The studio is rebuilt here from index.src.html rather than copied from
      # the committed index.html, so the installer can never ship an older build
      # than the source it was cut from. build.py also stages desktop/dist.
      - name: Build the studio and stage it into the shell
        shell: pwsh
        run: |
          python build.py
          Get-ChildItem desktop/dist

      # One logo lives in this repository; every size the installer and the
      # taskbar want is cut from it here rather than kept as more copies.
      - name: Cut the icons from the logo
        run: |
          python -m pip install --quiet pillow
          python desktop/make_icons.py

      - name: Test the serial layer
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is off until a certificate exists. See desktop/SIGNING.md —
          # add the two secrets there and the same build comes out signed, with
          # no other change to this file.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop

      - name: Keep the installers as a download
        uses: actions/upload-artifact@v4
        with:
          name: JZAK-Cuts-Windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish a release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: JZAK Cuts ${{ github.ref_name }}
          body: |
            Windows installer for JZAK Cuts.

            Download `JZAK Cuts_<version>_x64-setup.exe`, run it, and the studio
            installs for the current user — no administrator rights needed. The
            cutter is driven over USB by the program itself, so no browser and
            no internet connection are involved at any point.

            Not code-signed yet, so SmartScreen will show "Windows protected
            your PC" the first time. Click **More info ▸ Run anyway**.
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
